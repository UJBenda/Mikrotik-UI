# /etc/nginx/sites-available/mtcontroller.conf
# Dva hostname: admin UI (jen z admin sítě) a check-in (z internetu).

limit_req_zone $binary_remote_addr zone=mtc_checkin:10m rate=30r/m;

upstream mtc_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# --- admin UI ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name mtc-admin.example.cz;

    ssl_certificate     /etc/letsencrypt/live/mtc-admin.example.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtc-admin.example.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # přístup jen z admin sítě / VPN – upravit
    allow 10.10.0.0/24;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://mtc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- check-in a adopce (z internetu) ---------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name mtc-checkin.example.cz;

    ssl_certificate     /etc/letsencrypt/live/mtc-checkin.example.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtc-checkin.example.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;  # upload záloh

    # z internetu jsou dostupné jen tyto cesty, vše ostatní 404
    location ~ ^/(api/checkin|adopt/) {
        limit_req zone=mtc_checkin burst=20 nodelay;
        proxy_pass http://mtc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;  # neznámý hostname = žádná odpověď
}
