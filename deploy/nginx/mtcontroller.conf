# /etc/nginx/sites-available/mtcontroller.conf (generuje deploy/install.sh)
# Dva hostname: admin UI (jen z admin sítě) a check-in (z internetu).

# Za jednou veřejnou IP může být hodně MikroTiků (NAT lokality),
# proto štědrý limit: check-in je 1×/min + potvrzení příkazů.
limit_req_zone $binary_remote_addr zone=mtc_checkin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mtc_login:1m rate=10r/m;

upstream mtc_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mtc-admin.example.cz mtc-checkin.example.cz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- admin UI ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtc-admin.example.cz;

    ssl_certificate     __ADMIN_CERT__;
    ssl_certificate_key __ADMIN_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # přístup jen z admin sítě / VPN
    allow 10.10.0.0/24;  # mtc-admin-net
    allow 127.0.0.1;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/admin/login {
        limit_req zone=mtc_login burst=5 nodelay;
        proxy_pass http://mtc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://mtc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- check-in a adopce (z internetu) ---------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtc-checkin.example.cz;

    ssl_certificate     __CHECKIN_CERT__;
    ssl_certificate_key __CHECKIN_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    # z internetu jsou dostupné jen tyto cesty, vše ostatní 404
    location ~ ^/(api/checkin|adopt/|healthz$) {
        limit_req zone=mtc_checkin burst=200 nodelay;
        proxy_pass http://mtc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;  # neznámý hostname = žádná odpověď
}
