# /etc/nginx/sites-available/mtcontroller.conf – LOKÁLNÍ režim (generuje průvodce prvního spuštění)
# Jedna adresa pro správu i check-in; správa jen z vyjmenovaných sítí, check-in odkudkoli z LAN.

limit_req_zone $binary_remote_addr zone=mtc_checkin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mtc_login:1m rate=10r/m;

upstream mtc_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # CA controlleru pro zařízení (ověří si ji otiskem, viz routeros.trust_ca_body)
    location = /mtc-ca.crt {
        alias /etc/ssl/mtc-public/ca.crt;
        default_type application/x-x509-ca-cert;
    }
    location / { return 301 https://mtc.example.lan$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # správa jen ze sítí správy; check-in níže pro všechny
    allow 10.10.0.0/24;  # mtc-admin-net
    allow 127.0.0.1;
    deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # aplikace rozlišuje UI a check-in podle Host – tady je jedna adresa (IP i jméno)
    proxy_set_header Host mtc.example.lan;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    location ~ ^/(api/checkin|adopt/|enroll/|healthz$) {
        allow all;
        client_max_body_size 64k;
        limit_req zone=mtc_checkin burst=200 nodelay;
        proxy_pass http://mtc_web;
    }
    location = /api/admin/login {
        limit_req zone=mtc_login burst=5 nodelay;
        proxy_pass http://mtc_web;
    }
    location / {
        proxy_pass http://mtc_web;
    }
}
