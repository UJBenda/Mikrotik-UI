# /etc/nginx/sites-available/mtcontroller-setup.conf – průvodce prvního spuštění (instalace balíčku)
# Po dokončení průvodce ho nahradí mtcontroller.conf. Přístup chrání jednorázový kód.

limit_req_zone $binary_remote_addr zone=mtc_setup:1m rate=60r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/mtc/setup.crt;
    ssl_certificate_key /etc/ssl/mtc/setup.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;

    location / {
        limit_req zone=mtc_setup burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
