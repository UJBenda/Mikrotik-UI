# Drop-in pro mtc-worker při tunnel.manage_routes = true (dva koncentrátory):
# worker smí měnit jen routy (CAP_NET_ADMIN přes netlink), nic dalšího.
# install.sh ho nasadí/odstraní podle config.toml.
[Service]
AmbientCapabilities=CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_ADMIN
RestrictAddressFamilies=AF_NETLINK
