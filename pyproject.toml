[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtcontroller"
version = "0.1.0"
description = "Multi-tenant management controller for MikroTik RouterOS v7"
readme = "README.md"
requires-python = ">=3.11"
# Produkce instaluje závislosti z Debian apt (deploy/install.sh); tento seznam
# slouží pro vývoj mimo Debian.
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "psycopg>=3.1",
    "pydantic>=2.5",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtc-web = "mtcontroller.web.__main__:main"
mtc-worker = "mtcontroller.worker.__main__:main"
mtc-admin = "mtcontroller.cli:main"

[tool.setuptools.package-data]
mtcontroller = ["sql/*.sql", "web/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
